services:
  # =========================================================================
  # PostgreSQL Database (Version 16 - Alpine)
  # Native multi-arch (Apple Silicon ARM64 & AMD64), high-performance
  # =========================================================================
  db:
    image: postgres:16-alpine
    container_name: sizing-db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-PasswordKuat123!}
      - POSTGRES_DB=${DB_NAME:-sizing}
    volumes:
      - sizing_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-sizing}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # =========================================================================
  # Golang Sizing Engine Backend (Fiber API)
  # =========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: sizing-backend:latest
    container_name: sizing-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8089}:8089"
    environment:
      - PORT=8089
      - DATABASE_URL=${DATABASE_URL:-postgres://${DB_USER:-postgres}:${DB_PASSWORD:-PasswordKuat123!}@db:5432/${DB_NAME:-sizing}?sslmode=disable}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - TEMPLATES_DIR=/app/templates
      - TZ=${TZ:-Asia/Jakarta}
    volumes:
      - ./templates:/app/templates:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8089/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # =========================================================================
  # Nuxt 3 Sizing Suite Frontend
  # =========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: sizing-frontend:latest
    container_name: sizing-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - NITRO_PORT=3000
      - NITRO_HOST=0.0.0.0
      - NUXT_PUBLIC_API_BASE=${NUXT_PUBLIC_API_BASE:-http://localhost:8089}
      - API_BASE=${API_BASE:-http://localhost:8089}
      - BACKEND_URL=${BACKEND_INTERNAL_URL:-http://backend:8089}
      - TZ=${TZ:-Asia/Jakarta}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # =========================================================================
  # Optional: Nginx Gateway (Unified Single-Port / Reverse Proxy)
  # Jalankan dengan: docker compose --profile gateway up -d
  # =========================================================================
  gateway:
    image: nginx:alpine
    container_name: sizing-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    profiles:
      - gateway

volumes:
  sizing_db_data:
    name: sizing_db_data
