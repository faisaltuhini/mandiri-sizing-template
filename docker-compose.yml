services:
  # =========================================================================
  # Microsoft SQL Server / Azure SQL Edge
  # Lightweight, high-performance, runs on both ARM64 (Apple Silicon) & AMD64
  # =========================================================================
  db:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: sizing-db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-1433}:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD:-PasswordKuat123!}
      - MSSQL_PID=Developer
    volumes:
      - sizing_db_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # =========================================================================
  # Golang Sizing Engine Backend (Fiber API)
  # =========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: sizing-backend:latest
    container_name: sizing-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8089}:8089"
    environment:
      - PORT=8089
      - DATABASE_URL=${DATABASE_URL:-sqlserver://sa:${DB_PASSWORD_ENCODED:-PasswordKuat123%21}@db:1433?database=sizing&trustServerCertificate=true}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - GODEBUG=x509negativeserial=1
      - TEMPLATES_DIR=/app/templates
      - TZ=${TZ:-Asia/Jakarta}
    volumes:
      - ./templates:/app/templates:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8089/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # =========================================================================
  # Nuxt 3 Sizing Suite Frontend
  # =========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: sizing-frontend:latest
    container_name: sizing-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - PORT=3000
      - NITRO_PORT=3000
      - NITRO_HOST=0.0.0.0
      - NUXT_PUBLIC_API_BASE=${NUXT_PUBLIC_API_BASE:-http://localhost:8089}
      - API_BASE=${API_BASE:-http://localhost:8089}
      - BACKEND_URL=${BACKEND_INTERNAL_URL:-http://backend:8089}
      - TZ=${TZ:-Asia/Jakarta}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # =========================================================================
  # Optional: Nginx Gateway (Unified Single-Port / Reverse Proxy)
  # Jalankan dengan: docker compose --profile gateway up -d
  # =========================================================================
  gateway:
    image: nginx:alpine
    container_name: sizing-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    profiles:
      - gateway

volumes:
  sizing_db_data:
    name: sizing_db_data
