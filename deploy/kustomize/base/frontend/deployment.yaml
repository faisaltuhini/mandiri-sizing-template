apiVersion: apps/v1
kind: Deployment
metadata:
  name: sizing-frontend
  labels:
    app: sizing-frontend
    app.kubernetes.io/name: sizing-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: sizing-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sizing-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: sizing-frontend
        app.kubernetes.io/name: sizing-frontend
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: sizing-apps
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sizing-frontend
          image: sizing-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: sizing-frontend-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
