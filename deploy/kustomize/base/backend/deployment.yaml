apiVersion: apps/v1
kind: Deployment
metadata:
  name: sizing-backend
  labels:
    app: sizing-backend
    app.kubernetes.io/name: sizing-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: sizing-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sizing-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: sizing-backend
        app.kubernetes.io/name: sizing-backend
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: sizing-apps
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sizing-backend
          image: sizing-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8089
              protocol: TCP
          envFrom:
            - configMapRef:
                name: sizing-backend-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sizing-db-secret
                  key: DATABASE_URL
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
