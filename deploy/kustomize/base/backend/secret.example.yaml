# =========================================================================
# Sizing Backend Database Secret Example
# Salin file ini menjadi secret.yaml atau buat langsung via oc command:
# oc create secret generic sizing-db-secret \
#   --from-literal=DATABASE_URL="sqlserver://sa:YourPass@sqlserver.sizing.svc:1433?database=sizing&trustServerCertificate=true"
# =========================================================================
apiVersion: v1
kind: Secret
metadata:
  name: sizing-db-secret
  labels:
    app: sizing-backend
    app.kubernetes.io/name: sizing-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: sizing-apps
type: Opaque
stringData:
  # Contoh Microsoft SQL Server:
  DATABASE_URL: "sqlserver://sa:P%40ssw0rd.1@sqlserver.database.svc:1433?database=sizing&trustServerCertificate=true"
  # Atau contoh PostgreSQL:
  # DATABASE_URL: "postgres://sizing_user:SecretPass@postgres.database.svc:5432/sizing?sslmode=disable"
