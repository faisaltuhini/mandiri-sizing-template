# =========================================================================
# Sizing Backend Database Secret Example
# Salin file ini menjadi secret.yaml atau buat langsung via oc/kubectl command:
# kubectl create secret generic sizing-db-secret \
#   --from-literal=DATABASE_URL="postgres://sizing_user:YourPass@postgres.sizing.svc:5432/sizing?sslmode=disable"
# =========================================================================
apiVersion: v1
kind: Secret
metadata:
  name: sizing-db-secret
  labels:
    app: sizing-backend
    app.kubernetes.io/name: sizing-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: sizing-apps
type: Opaque
stringData:
  DATABASE_URL: "postgres://postgres:PasswordKuat123%21@postgres.database.svc:5432/sizing?sslmode=disable"
