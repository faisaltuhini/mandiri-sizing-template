apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sizing-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: sizing.faisalaffan.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: sizing-backend
                port:
                  number: 8089
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sizing-frontend
                port:
                  number: 3000
  tls:
    - hosts:
        - sizing.faisalaffan.com
      secretName: sizing-tls
