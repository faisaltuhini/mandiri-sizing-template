apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sizing

labels:
  - pairs:
      app.kubernetes.io/part-of: sizing-apps
      environment: production

resources:
  - ../../base/backend
  - ../../base/frontend
  - ingress.yaml
  - secret.yaml

images:
  - name: sizing-backend
    newName: localhost:5000/sizing-backend
    newTag: latest
  - name: sizing-frontend
    newName: localhost:5000/sizing-frontend
    newTag: latest

patches:
  - target:
      kind: ConfigMap
      name: sizing-frontend-config
    patch: |-
      - op: replace
        path: /data/API_BASE
        value: ""
      - op: replace
        path: /data/NUXT_PUBLIC_API_BASE
        value: ""
      - op: add
        path: /data/BACKEND_URL
        value: "http://sizing-backend:8089"

  - target:
      kind: Deployment
      name: sizing-backend
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: GODEBUG
          value: "x509negativeserial=1"
