apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sizing-dev

resources:
  - ../../base

labels:
  - pairs:
      environment: dev

# Override image tags / registry if needed
images:
  - name: sizing-backend
    newName: image-registry.openshift-image-registry.svc:5000/sizing-dev/sizing-backend
    newTag: dev-latest
  - name: sizing-frontend
    newName: image-registry.openshift-image-registry.svc:5000/sizing-dev/sizing-frontend
    newTag: dev-latest

# ConfigMap patches for DEV environment
patches:
  - target:
      kind: ConfigMap
      name: sizing-frontend-config
    patch: |-
      - op: replace
        path: /data/API_BASE
        value: "http://sizing-backend:8089"
